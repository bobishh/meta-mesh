[package]
name = "meta-mesh-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bip39 = { version = "2", default-features = false, features = ["std"] }
ed25519-compact = { version = "2.1.1", default-features = false, features = ["std"] }
hkdf = "0.12"
pbkdf2 = "0.12"
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
url = "2"
