[package]
name = "meta-mesh-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
meta-mesh-core = { path = "../meta-mesh-core" }
bytes = "1.12"
blake3 = "1.8"
futures-lite = "2"
iroh = "1.2.0"
iroh-gossip = { version = "0.101.0", features = ["net"] }
iroh-blobs = "0.103.0"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
automerge = "0.12"
hex = "0.4"
n0-future = "0.3"
postcard = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
