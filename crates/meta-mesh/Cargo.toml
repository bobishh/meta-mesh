[package]
name = "meta-mesh"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meta-mesh-core = { path = "../meta-mesh-core", features = ["wasm"] }
iroh = { version = "0.98.2", default-features = false }
iroh-webrtc-transport = { path = "../../vendor/iroh-webrtc-transport", version = "0.1.0-alpha.2", default-features = false, features = ["browser"] }
iroh-gossip = { version = "0.98.0", default-features = false }
iroh-blobs = { version = "0.100.0", default-features = false }
wasm-bindgen = "=0.2.118"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
blake3 = "1.8"
rand = "0.10"
bytes = "1.12"
hex = "0.4"
postcard = "1"
n0-future = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"], default-features = false }
web-sys = { version = "0.3", features = ["console"] }
