name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formal-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check bounded protocol models and negative controls
        run: ./formal/check.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Rust WASM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes llvm lld
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.118 --locked
      - run: npm ci
      - run: cargo test --workspace
      - run: cargo test --manifest-path crates/meta-mesh-native/Cargo.toml
      - run: cargo test --manifest-path crates/meta-mesh-mobile/Cargo.toml
      - name: Verify generated Swift and Kotlin bindings
        run: |
          ./scripts/generate-mobile-bindings.sh
          git diff --exit-code -- crates/meta-mesh-mobile/generated
      - name: Verify generated browser WASM bindings
        run: |
          ./scripts/build-wasm.sh
          ./scripts/check-wasm-api.sh
      - run: npm run check
      - run: npm test

  apple-package:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Apple Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"
      - name: Build and verify Apple package
        run: |
          ./scripts/build-apple-xcframework.sh
          ./scripts/verify-apple-xcframework.sh
      - name: Verify Swift and Kotlin clients against native runtime
        run: ./scripts/test-mobile-language-interop.sh
